services:
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-service:latest
    container_name: agent_service
    ports:
      - "${SERVER_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8001
      SERVER_RELOAD: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/health')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
